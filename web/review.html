<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Property screening — dashboard</title><link rel="stylesheet" href="assets/style.css"><script src="assets/review.js" defer></script></head><body>
<header><div class="header-identity"><a class="brand" href="/"><svg class="brand-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m3 10 9-7 9 7"/><path d="M5 9v12h5v-7h4v7h5V9"/></svg><span>Property Screening</span></a><span id="report-status" class="tag" role="status" aria-live="polite" aria-atomic="true" hidden></span></div><a class="header-link" href="/">Client property form →</a></header>
<div class="workspace"><aside><h2 id="submissions-title" hidden>Client submissions</h2><div class="record-list" id="records"></div></aside>
<main>
<div id="record" hidden><div class="review-top"><div><h1 id="record-title"></h1><p id="record-subtitle" class="muted"></p></div><a id="json-link" class="button secondary small">Export JSON</a></div>
<section class="panel" id="run-panel"><div id="draft-controls"><label for="additional-info">Additional information for the AI</label><textarea id="additional-info" rows="3" maxlength="8000" placeholder="Optional: agent comments, property details, or other context…"></textarea><div class="actions"><button id="delete-record" type="button" class="secondary">Delete draft</button><button id="generate">Generate report</button></div></div><form id="quick-rent-form" hidden><p>Enter a monthly rent estimate to continue.</p><div class="grid"><label>Expected monthly rent (£)<input id="quick-rent" type="number" min="1" max="1000000" step="any" required></label><label>Where the estimate came from<input id="quick-rent-source" maxlength="2000" placeholder="Agent estimate, date, or your working assumption"></label></div><button type="submit">Use rent & generate report</button></form></section>
<section class="panel" id="photo-panel" hidden><h2>Property photos</h2><form id="photo-form"><div class="photo-upload-grid">
<div><h3>Cover photo</h3><label class="photo-drop-zone" data-photo-zone="cover"><input id="cover-photo-input" type="file" accept="image/jpeg,image/png,image/webp" aria-label="Choose the cover photo"><span>Drop a photo here or <strong>choose a file</strong></span><small>Required · 1 photo maximum</small></label><div id="cover-photo-preview" class="upload-previews"></div></div>
<div><h3>House photos</h3><label class="photo-drop-zone" data-photo-zone="gallery"><input id="gallery-photo-input" type="file" accept="image/jpeg,image/png,image/webp" multiple aria-label="Choose additional house photos"><span>Drop photos here or <strong>choose files</strong></span><small>Optional · 10 photos maximum</small></label><div id="gallery-photo-preview" class="upload-previews"></div></div>
</div><p class="muted">JPEG, PNG or WebP · Up to 10 MB per photo</p><div class="actions"><button id="save-photos" type="submit" disabled>Add photos to PDF</button></div></form></section>
<section id="review-approval" class="panel" hidden><div class="row-title"><h2>Your report</h2><span class="pill" id="report-pages">10 pages</span></div><div class="actions" id="downloads"></div><iframe id="pdf-preview" title="Property report PDF preview"></iframe><form id="revision-form"><label for="revision-instruction">Tell the AI what to change</label><textarea id="revision-instruction" rows="3" maxlength="3000" required placeholder="Change the title, rewrite a section, or adjust the figures…"></textarea><p id="revision-result" class="action-feedback" role="status" aria-live="polite"></p><div class="actions"><button id="revise" type="submit" class="secondary">Update PDF</button><button id="finalize" type="button">Approve &amp; finalize</button></div></form></section>
</div></main></div></body></html>
