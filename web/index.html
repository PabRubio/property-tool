<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lacewing Analytics</title><link rel="stylesheet" href="assets/style.css"><script src="assets/intake.js" defer></script></head>
<body><header><div class="header-identity"><a class="brand" href="./"><svg class="brand-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m3 10 9-7 9 7"/><path d="M5 9v12h5v-7h4v7h5V9"/></svg><span>Lacewing Analytics</span></a><span class="tag">England · Long-term rentals</span></div><a class="header-link" href="review" id="review-link">Analyst dashboard →</a></header>
<main class="intake"><div id="brief-entry"><h1>Property brief</h1>
<form id="brief-form">
<section class="panel"><h2>About you</h2><div class="grid">
<label>Your name / firm <span class="required-marker" aria-hidden="true">*</span><input name="name" autocomplete="name" required maxlength="150"></label>
<label>Contact email <span class="required-marker" aria-hidden="true">*</span><input name="email" type="email" autocomplete="email" required maxlength="254"></label>
<label class="wide">Main goal<textarea name="goal" rows="2" maxlength="500" placeholder="What would you like this research to help you decide?"></textarea></label>
<label>Purpose of screening<select name="purpose"><option value="buy">Considering a purchase</option><option value="viewing">Deciding whether to arrange a viewing</option><option value="comparison">Comparing investments</option><option value="client">Research for a client</option></select></label>
<label>Cash available to invest (£)<input name="cash_budget" type="text" inputmode="decimal" data-number="money" data-min="0" data-max="100000000" placeholder="Deposit, fees, works and reserves"></label>
</div></section>
<section class="panel"><h2>Your enquiry</h2>
<label class="check"><input name="area_only" type="checkbox">I don't have a specific property yet; I have an area and budget in mind.</label>
<fieldset id="area-fields" hidden disabled><div class="grid">
<label>Area of interest <span class="required-marker" aria-hidden="true">*</span><input name="area" maxlength="500" required placeholder="Town, neighbourhood or postcode area"></label>
<label>Property purchase budget (£) <span class="required-marker" aria-hidden="true">*</span><input name="budget" type="text" inputmode="decimal" data-number="money" data-min="1" data-max="100000000" required></label>
</div></fieldset>
<fieldset id="property-fields"><div class="grid">
<label class="wide">Full address <span class="required-marker" aria-hidden="true">*</span><input name="address" placeholder="Flat / house number, street and town" required maxlength="500"></label>
<label>Postcode <span class="required-marker" aria-hidden="true">*</span><input name="postcode" required placeholder="M1 1AA" maxlength="10"></label>
<label>Price status <span class="required-marker" aria-hidden="true">*</span><select name="price_status" id="price-status" required><option value="listed">Listed for sale</option><option value="under_offer">Under offer</option><option value="proposed">I have a proposed purchase price</option><option value="unknown">No price known</option></select></label>
<label id="price-field">Listing / offer / proposed price (£) <span class="required-marker" aria-hidden="true">*</span><input name="asking_price" type="text" inputmode="decimal" data-number="money" data-min="1" data-max="100000000" required placeholder="For example, £250,000"></label>
<label>Property type <span class="required-marker" aria-hidden="true">*</span><select name="property_type" id="property-type" required><option value="">Choose…</option><option value="flat">Flat / maisonette</option><option value="converted_flat">Converted flat</option><option value="studio">Studio</option><option value="terraced_house">Terraced house</option><option value="semi-detached_house">Semi-detached house</option><option value="detached_house">Detached house</option><option value="bungalow">Bungalow</option></select></label>
<label id="attachment-field" hidden>Bungalow layout <span class="required-marker" aria-hidden="true">*</span><select name="building_attachment" disabled required><option value="">Choose…</option><option value="detached_house">Detached</option><option value="semi-detached_house">Semi-detached</option><option value="terraced_house">Terraced</option></select></label>
<label>Bedrooms <span class="required-marker" aria-hidden="true">*</span><input name="bedrooms" type="number" min="0" max="20" step="1" required></label>
<label>Bathrooms<input name="bathrooms" type="number" min="0" max="5" step="1"></label>
<label>Internal floor area (m²)<input name="floor_area_sqm" type="number" min="1" max="10000" step="0.01" placeholder="Leave blank if unknown"></label>
<label>Approximate construction age<select name="construction_date"><option value="">Not known</option><option value="pre_1914">Before 1914</option><option value="1914_2000">1914–1999</option><option value="2000_onwards">2000 onwards</option></select></label>
<label>Interior condition<select name="finish_quality"><option value="">Not known</option><option value="very_high">Luxury finish</option><option value="high">High standard</option><option value="average">Average / good condition</option><option value="below_average">Needs updating</option><option value="unmodernised">Needs substantial renovation</option></select></label>
<label>Outdoor space<select name="outdoor_space"><option value="">Not known</option><option value="none">None</option><option value="balcony_terrace">Balcony / terrace</option><option value="garden">Garden</option><option value="garden_very_large">Very large garden</option></select></label>
<label>Off-street parking spaces<select name="off_street_parking"><option value="">Not known</option><option value="0">None</option><option value="1">1</option><option value="2">2</option><option value="3">3 or more</option></select></label>
<label>Ownership type<select name="tenure"><option value="unknown">Not known</option><option value="freehold">Freehold</option><option value="leasehold">Leasehold</option></select></label>
<label class="check"><input name="new_build" type="checkbox">New build</label>
<label class="wide">Listing URL (optional)<input name="listing_url" type="url" placeholder="https://…" maxlength="2000"></label>
</div></fieldset></section>
<fieldset id="investment-fields"><section class="panel"><h2>Purchase and financing</h2><div class="grid">
<label>Buying as <span class="required-marker" aria-hidden="true">*</span><select name="buyer_type" required><option value="">Choose…</option><option value="individual">Individual</option><option value="company">Company</option></select></label>
<label>Do you or any joint buyers own other residential property anywhere in the world? <span class="required-marker" aria-hidden="true">*</span><select name="additional_property" required><option value="">Choose…</option><option value="yes">Yes</option><option value="no">No</option></select></label>
<label>Are all buyers UK resident for stamp duty purposes? <span class="required-marker" aria-hidden="true">*</span><select name="uk_resident" required><option value="">Choose…</option><option value="yes">Yes</option><option value="no">No / not all buyers</option></select></label>
<label>Cash or mortgage <span class="required-marker" aria-hidden="true">*</span><select name="financing" id="financing" required><option value="">Choose…</option><option value="cash">Cash purchase</option><option value="mortgage">Mortgage</option></select></label>
<label>Expected years of ownership<select name="holding_years"><option value="">Not sure — compare 3, 5 and 10 years</option><option value="3">3 years</option><option value="5">5 years</option><option value="10">10 years</option><option value="15">15+ years (model 15)</option></select></label>
</div><fieldset id="mortgage-fields" disabled hidden><div class="grid">
<label>Deposit format<select name="deposit_format"><option value="amount">Pounds (£)</option><option value="percent">Percentage of purchase price</option></select></label>
<label id="deposit-amount-field">Deposit towards purchase (£) <span class="required-marker" aria-hidden="true">*</span><input name="deposit_amount" type="text" inputmode="decimal" data-number="money" data-min="1" data-max="100000000" required></label>
<label id="deposit-percent-field" hidden>Deposit (%) <span class="required-marker" aria-hidden="true">*</span><input name="deposit_pct" type="text" inputmode="decimal" data-number="percent" data-min="5" data-max="99.99" required disabled></label>
<label>Repayment type <span class="required-marker" aria-hidden="true">*</span><select name="repayment_type" required><option value="interest_only">Interest-only</option><option value="repayment">Repayment</option><option value="mortgage_unsure">Not sure — model interest-only for now</option></select></label>
<label>Annual interest rate (%) (optional)<input name="interest_rate_pct" type="text" inputmode="decimal" data-number="percent" data-min="0" data-max="30" placeholder="If known"></label>
<label>How long is the interest rate fixed for? (optional)<select name="rate_type"><option value="unknown">Not sure</option><option value="2">2 years</option><option value="3">3 years</option><option value="5">5 years</option><option value="10">10 years</option><option value="tracker">Tracker / variable</option></select></label>
<label id="reset-rate-field" hidden>Rate after the fixed period (%) (optional)<input name="rate_after_fix_pct" type="text" inputmode="decimal" data-number="percent" data-min="0" data-max="50" disabled placeholder="If known"></label>
<label id="mortgage-term-field" hidden>Length of the whole loan, e.g. 25 <span class="required-marker" aria-hidden="true">*</span><input name="mortgage_term_years" type="number" min="1" max="40" step="1" required value="25" disabled></label>
</div></fieldset></section>
<section class="panel"><h2>Works and targets</h2><div class="grid">
<label>Refurbishment <span class="required-marker" aria-hidden="true">*</span><select name="refurb_level" required><option value="none">No refurbishment</option><option value="refurb_light">Light refurbishment</option><option value="refurb_moderate">Moderate refurbishment</option><option value="refurb_heavy">Heavy refurbishment</option></select></label>
<label id="refurb-budget-field" hidden>Refurbishment budget (£, if known)<input name="refurbishment" type="text" inputmode="decimal" data-number="money" data-min="0" data-max="10000000" disabled></label>
<label id="after-works-field" hidden>Value after works (£, if known)<input name="after_works_value" type="text" inputmode="decimal" data-number="money" data-min="1" data-max="100000000" disabled></label>
<label id="refurb-finish-field" hidden>Finish for the estimate<select name="refurb_finish" disabled><option value="medium">Standard</option><option value="basic">Basic</option><option value="premium">Premium</option></select></label>
<label>Target net rental yield (%) (optional)<input name="min_net_yield_pct" type="text" inputmode="decimal" data-number="percent" data-min="0" data-max="100" placeholder="After running costs, before mortgage and tax"></label>
<label>Target monthly cash flow (£) (optional)<input name="min_monthly_cashflow" type="text" inputmode="decimal" data-number="money" data-min="-100000" data-max="1000000" placeholder="After mortgage payments, before income tax"></label>
</div>
<details><summary>Known costs and rental information</summary><div class="grid">
<label>Expected monthly rent (£, if known)<input name="monthly_rent" type="text" inputmode="decimal" data-number="money" data-min="1" data-max="1000000"></label>
<label>Basis of rent estimate<input name="rent_source" maxlength="1000" placeholder="For example, a letting agent's estimate"></label>
<label>Legal purchase fees (£)<input name="legal_fees" type="text" inputmode="decimal" data-number="money" data-min="0" data-max="1000000"></label>
<label>Survey fees (£)<input name="survey_fees" type="text" inputmode="decimal" data-number="money" data-min="0" data-max="100000"></label>
<label>Management fee including VAT (%)<input name="management_pct" type="text" inputmode="decimal" data-number="percent" data-min="0" data-max="50"></label>
<label>Upfront fire / safety costs (£)<input name="safety_upfront" type="text" inputmode="decimal" data-number="money" data-min="0" data-max="1000000"></label>
<label>Annual service / estate charge (£)<input name="service_charge" type="text" inputmode="decimal" data-number="money" data-min="0" data-max="1000000"></label>
<label>Annual ground rent (£)<input name="ground_rent" type="text" inputmode="decimal" data-number="money" data-min="0" data-max="1000000"></label>
<label>Annual landlord-paid regular cleaning (£)<input name="regular_cleaning" type="text" inputmode="decimal" data-number="money" data-min="0" data-max="100000" placeholder="Leave blank if unknown"></label>
<label>Annual cleaning between tenancies (£)<input name="turnover_cleaning" type="text" inputmode="decimal" data-number="money" data-min="0" data-max="100000" placeholder="Leave blank if unknown"></label>
<label>Remaining lease (years)<input name="lease_years" type="number" min="0" max="999" step="1"></label>
</div></details></section></fieldset>
<section class="panel"><label>Anything else we should know? (optional)<textarea name="notes" rows="3" placeholder="Plans, concerns, or information from the agent" maxlength="8000"></textarea></label>
<label class="check"><input name="england" type="checkbox" required><span>I confirm the property or area is in England and the enquiry concerns a long-term rental investment.</span></label>
<label class="check"><input name="terms_accepted" type="checkbox" required><span>I agree to the <a href="/terms" target="_blank" rel="noopener">terms</a>: research and information only, not financial, tax or legal advice. <a href="/privacy" target="_blank" rel="noopener">Privacy notice</a>.</span></label>
<label class="check"><input name="follow_up_contact" type="checkbox">We may contact you to arrange a short feedback call about the free trial or to ask for a testimonial.</label>
</section><p id="brief-error" class="generation-error" role="alert" hidden></p>
<div class="actions"><button type="submit" id="submit-brief">Submit property</button><button type="button" class="secondary" id="export-brief">Download brief as JSON</button></div>
</form></div>
<section id="brief-success" class="panel submission-success" role="status" aria-live="polite" aria-labelledby="success-title" tabindex="-1" hidden>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="32" cy="32" r="28"/><path d="m19 32 9 9 17-18"/></svg>
<h1 id="success-title">Property submitted successfully</h1><p>Your property brief has been received and is being processed.</p>
</section></main>
</body></html>
